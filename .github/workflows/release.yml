name: Release licence SDK

# Push a tag like v0.2.0 (it must match <version> in pom.xml) to build, test, attach the jars to a
# GitHub Release and publish to GitHub Packages (Maven).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Tag matches the pom version
        run: |
          version="$(mvn -q -B -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom version ${version} (expected v${version})" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build and test
        run: mvn -B verify

      - name: Publish to GitHub Packages
        run: mvn -B -DskipTests deploy -Dgithub.repository="${GITHUB_REPOSITORY}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release with the jars
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "target/peakstone-license-${VERSION}.jar" \
            "target/peakstone-license-${VERSION}-sources.jar" \
            --title "Peakstone licence SDK ${VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
